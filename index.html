<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShineLee's AI Lab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(120% 120% at 50% 0%, #1a1a2e 0%, #0d0d14 55%, #050507 100%);
      min-height: 100vh;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    /* ---- Full-screen looping background video ---- */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.1);
      z-index: 0;
      opacity: 0; /* fade system controls this */
    }
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(0,0,0,0.15), rgba(0,0,0,0.5) 70%, rgba(0,0,0,0.78) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
    }

    /* ---- Liquid glass (masked gradient border) ---- */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .serif { font-family: 'Instrument Serif', serif; }

    /* ---- Wordmark (top-left, minimal) ---- */
    .wordmark {
      position: fixed;
      top: 1.75rem;
      left: 1.75rem;
      z-index: 3;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
    }

    /* ---- Centered cinematic hero ---- */
    .hero {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      gap: 1.5rem;
    }
    .hero-title {
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 1.02;
      color: #fff;
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.015em;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.55);
    }
    .hero-tagline {
      font-size: clamp(1.1rem, 2.4vw, 1.6rem);
      font-style: italic;
      color: rgba(255, 255, 255, 0.82);
      margin: 0;
      font-weight: 400;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.6);
    }
    .enter-btn {
      margin-top: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 2.2rem;
      border-radius: 9999px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.25s ease;
    }
    .enter-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }
    .enter-btn svg { width: 18px; height: 18px; }

    /* ---- Social footer ---- */
    .social {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      gap: 1rem;
    }
    .social a {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: color 0.3s ease, background 0.3s ease, transform 0.25s ease;
    }
    .social a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }
    .social svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <video

  ></video>

  <a href="index.html" class="wordmark serif">ShineLee</a>

  <main class="hero">

    <a href="tools.html" class="liquid-glass enter-btn">

  <script>
    /* ============ Background video fade system (requestAnimationFrame) ============ */
    (function () {
      const video = document.getElementById('bgVideo');
      let opacityRef = 0;
      let fadeRef = null;
      let fadedIn = false;

      function fadeTo(target, duration) {
        if (fadeRef !== null) cancelAnimationFrame(fadeRef);
        const start = performance.now();
        const startOpacity = opacityRef;
        function animate(now) {
          const elapsed = now - start;
          const t = Math.min(elapsed / duration, 1);
          const current = startOpacity + (target - startOpacity) * t;
          opacityRef = current;
          video.style.opacity = current;
          if (t < 1) fadeRef = requestAnimationFrame(animate);
          else fadeRef = null;
        }
        fadeRef = requestAnimationFrame(animate);
      }

      // Watchdog: poll every frame; fade in as soon as the video has decodable
      // frames, instead of relying on a single (missable) 'playing' event.
      function watchdog() {
        if (video.readyState >= 2 && !fadedIn) {
          fadedIn = true;
          fadeTo(1, 800);
        }
        requestAnimationFrame(watchdog);
      }
      requestAnimationFrame(watchdog);

      video.addEventListener('error', function () {
        console.error('[bgVideo] failed to load — check the src URL / network:', video.error);
      });

      video.play().catch(function (e) {
        console.warn('[bgVideo] autoplay blocked, retrying on first interaction:', e);
        const retry = function () {
          video.play().catch(function () {});
          window.removeEventListener('click', retry);
          window.removeEventListener('touchstart', retry);
        };
        window.addEventListener('click', retry);
        window.addEventListener('touchstart', retry);
      });
    })();
  </script>
</body>
</html>
