<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShineLee's AI Lab - Where curiosity meets code." />
  <meta name="theme-color" content="#0d0d14" />
  <title>ShineLee's AI Lab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(120% 120% at 50% 0%, #1a1a2e 0%, #0d0d14 55%, #050507 100%);
      min-height: 100vh;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    /* ---- Full-screen looping background video ---- */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0; /* fade system controls this */
      transition: opacity 0.8s ease;
    }

    /* ---- Liquid glass (masked gradient border) ---- */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.02);
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .serif { font-family: 'Instrument Serif', serif; }

    /* ---- Wordmark (top-left, minimal) ---- */
    .wordmark {
      position: fixed;
      top: 1.75rem;
      left: 1.75rem;
      z-index: 3;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
      border-radius: 0.35rem;
      transition: opacity 0.2s ease;
    }
    .wordmark:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 4px;
    }
    .wordmark:hover { opacity: 0.85; }

    /* ---- Hero: text pinned near the top, compact, video stays visible ---- */
    .hero {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3.5rem 1.5rem 2rem;
      gap: 1rem;
    }
    .hero-title {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      line-height: 1.05;
      color: #fff;
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
    }
    .hero-tagline {
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      font-style: italic;
      color: rgba(255, 255, 255, 0.88);
      margin: 0;
      font-weight: 400;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.65);
    }
    .enter-btn {
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 2rem;
      border-radius: 9999px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }
    .enter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .enter-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }
    .enter-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.25s ease;
    }
    .enter-btn:hover svg {
      transform: translateX(3px);
    }

    /* ---- Motion accessibility: respect user preference ---- */
    @media (prefers-reduced-motion: reduce) {
      #bgVideo { display: none !important; }
      .enter-btn:hover { transform: none !important; }
      .enter-btn:hover svg { transform: none !important; }
      body {
        background: radial-gradient(120% 120% at 50% 0%, #1a1a2e 0%, #0d0d14 55%, #050507 100%);
      }
    }
  </style>
</head>
<body>
  <video
    id="bgVideo"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
  ></video>
  <a href="index.html" class="wordmark serif">ShineLee</a>

  <main class="hero">
    <h1 class="hero-title serif">ShineLee's <span class="serif" style="font-style:italic">AI Lab</span></h1>
    <p class="hero-tagline serif">Where curiosity meets code.</p>
    <a href="tools.html" class="liquid-glass enter-btn">
      Explore the lab
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
      </svg>
    </a>
  </main>

  <script>
    /* ============ Background video fade system (requestAnimationFrame) ============ */
    (function () {
      const video = document.getElementById('bgVideo');
      let opacityRef = 0;
      let fadeRef = null;
      let fadedIn = false;

      function fadeTo(target, duration) {
        if (fadeRef !== null) cancelAnimationFrame(fadeRef);
        const start = performance.now();
        const startOpacity = opacityRef;
        function animate(now) {
          const elapsed = now - start;
          const t = Math.min(elapsed / duration, 1);
          const current = startOpacity + (target - startOpacity) * t;
          opacityRef = current;
          video.style.opacity = current;
          if (t < 1) fadeRef = requestAnimationFrame(animate);
          else fadeRef = null;
        }
        fadeRef = requestAnimationFrame(animate);
      }

      function watchdog() {
        if (video.readyState >= 2 && !fadedIn) {
          fadedIn = true;
          fadeTo(1, 800);
        }
        requestAnimationFrame(watchdog);
      }
      requestAnimationFrame(watchdog);

      video.addEventListener('error', function () {
        console.warn('[bgVideo] background video fallback active');
      });

      video.play().catch(function (e) {
        const retry = function () {
          video.play().catch(function () {});
          window.removeEventListener('click', retry);
          window.removeEventListener('touchstart', retry);
        };
        window.addEventListener('click', retry);
        window.addEventListener('touchstart', retry);
      });
    })();
  </script>
</body>
</html>
