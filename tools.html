<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShineLee's AI Lab - Deployed Tools" />
  <meta name="theme-color" content="#0d0d14" />
  <title>ShineLee's AI Lab | Deployed Tools</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(120% 120% at 50% 0%, #1a1a2e 0%, #0d0d14 55%, #050507 100%);
      min-height: 100vh;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    /* ---- Full-screen looping background video ---- */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(0,0,0,0.25), rgba(0,0,0,0.65) 70%, rgba(0,0,0,0.88) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
    }

    /* ---- Liquid glass (masked gradient border) ---- */
    .liquid-glass {
      background: rgba(13, 13, 20, 0.45);
      background-blend-mode: luminosity;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12), 0 8px 32px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .serif { font-family: 'Instrument Serif', serif; }

    /* ---- Back link ---- */
    .back-link {
      position: fixed;
      top: 1.75rem;
      left: 1.75rem;
      z-index: 10;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .back-link:hover {
      opacity: 0.85;
      transform: translateX(-2px);
    }
    .back-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    /* ---- Content layer ---- */
    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 5.5rem 1.5rem 5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
    }
    .page-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.05;
      text-align: center;
      color: #fff;
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
    }
    .page-sub {
      text-align: center;
      color: rgba(255, 255, 255, 0.82);
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
    }

    .grid {
      width: 100%;
      max-width: 76rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
      gap: 1.75rem;
      margin-top: 1rem;
    }

    /* ---- Repo cards ---- */
    .repo-card {
      padding: 1.6rem;
      border-radius: 1.25rem;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 12rem;
      height: 100%;
    }
    .repo-card > div { flex: 1 1 auto; }
    .repo-card:hover {
      transform: translateY(-4px);
      background: rgba(25, 25, 38, 0.6);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    .repo-name {
      font-size: 1.45rem;
      font-style: italic;
      color: #fff;
      margin: 0 0 0.6rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .repo-desc {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.6;
      margin: 0 0 1.25rem;
    }
    .repo-link {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 0.85rem;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-decoration: none;
      margin-top: auto;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }
    .repo-link:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }
    .repo-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* ---- Shimmer Skeleton Loading ---- */
    .skeleton-card {
      padding: 1.6rem;
      border-radius: 1.25rem;
      min-height: 12rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .skeleton-line {
      height: 1.2rem;
      border-radius: 0.4rem;
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite ease-in-out;
      margin-bottom: 0.75rem;
    }
    .skeleton-line.short { width: 50%; height: 1.4rem; }
    .skeleton-line.medium { width: 85%; }
    .skeleton-line.full { width: 100%; height: 2.2rem; margin-top: auto; border-radius: 0.85rem; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---- Auth gate ---- */
    #authOverlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(5, 5, 8, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .auth-card {
      width: 100%;
      max-width: 24rem;
      padding: 2.2rem;
      border-radius: 1.5rem;
      text-align: center;
      background: rgba(18, 18, 28, 0.7);
    }
    .auth-title {
      font-size: 2rem;
      font-style: italic;
      color: #fff;
      margin: 0 0 1.25rem;
      font-weight: 400;
    }
    .auth-sub {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0 1.5rem;
    }
    .field {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 0.85rem 1rem;
      border-radius: 0.85rem;
      color: #fff;
      text-align: center;
      outline: none;
      font-size: 1rem;
      letter-spacing: 0.05em;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .field:focus {
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
    }
    .auth-msg {
      min-height: 1.25rem;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      color: #f87171;
      transition: opacity 0.2s ease;
    }
    .btn-primary {
      width: 100%;
      margin-top: 0.5rem;
      background: #fff;
      color: #0a0a0a;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1rem;
      border-radius: 0.85rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-1px);
    }
    .btn-primary:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* ---- Error shake animation ---- */
    @keyframes authShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake {
      animation: authShake 0.4s ease;
    }

    /* ---- Fallback state ---- */
    .fallback-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1.5rem;
      border-radius: 1.25rem;
      max-width: 32rem;
      margin: 0 auto;
    }
    .retry-btn {
      margin-top: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .retry-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* ---- Motion accessibility ---- */
    @media (prefers-reduced-motion: reduce) {
      .repo-card:hover { transform: none !important; }
      .repo-link:hover { transform: none !important; }
      .skeleton-line { animation: none !important; }
      .shake { animation: none !important; }
    }
  </style>
</head>
<body>
  <video
    id="bgVideo"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
  ></video>
  <div class="video-overlay"></div>

  <a href="index.html" class="back-link serif">&larr; ShineLee</a>

  <!-- Auth Gate -->
  <div id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="liquid-glass auth-card" id="authCard">
      <h2 class="auth-title serif" id="authTitle">ShineLee's AI Lab</h2>
      <p class="auth-sub">请输入访问密钥解锁在线实验室服务</p>
      <input
        type="password"
        id="passInput"
        placeholder="输入访问密钥"
        class="field"
        autocomplete="current-password"
        autofocus
      />
      <div id="authMsg" class="auth-msg"></div>
      <button id="unlockBtn" class="btn-primary">立即解锁</button>
    </div>
  </div>

  <!-- Content -->
  <main class="content">
    <h1 class="page-title serif">Deployed <span class="serif" style="font-style:italic">Tools</span></h1>
    <p class="page-sub">已自动同步所有在线服务与实验室项目</p>
    <div id="repos" class="grid" aria-live="polite"></div>
  </main>

  <script>
    /* ============ Background video fade system (requestAnimationFrame) ============ */
    (function () {
      const video = document.getElementById('bgVideo');
      let opacityRef = 0;
      let fadeRef = null;
      let fadedIn = false;

      function fadeTo(target, duration) {
        if (fadeRef !== null) cancelAnimationFrame(fadeRef);
        const start = performance.now();
        const startOpacity = opacityRef;
        function animate(now) {
          const elapsed = now - start;
          const t = Math.min(elapsed / duration, 1);
          const current = startOpacity + (target - startOpacity) * t;
          opacityRef = current;
          video.style.opacity = current;
          if (t < 1) fadeRef = requestAnimationFrame(animate);
          else fadeRef = null;
        }
        fadeRef = requestAnimationFrame(animate);
      }

      function watchdog() {
        if (video.readyState >= 2 && !fadedIn) {
          fadedIn = true;
          fadeTo(1, 800);
        }
        requestAnimationFrame(watchdog);
      }
      requestAnimationFrame(watchdog);

      video.addEventListener('error', function () {
        console.warn('[bgVideo] background video fallback active');
      });

      video.play().catch(function () {
        const retry = function () {
          video.play().catch(function () {});
          window.removeEventListener('click', retry);
          window.removeEventListener('touchstart', retry);
        };
        window.addEventListener('click', retry);
        window.addEventListener('touchstart', retry);
      });
    })();

    /* ============ Auth Gate + Deployed Tools Handler ============ */
    const USERNAME = 'shinelee2014';
    const CORRECT_PASS = 'sean';

    const authOverlay = document.getElementById('authOverlay');
    const authCard = document.getElementById('authCard');
    const passInput = document.getElementById('passInput');
    const authMsg = document.getElementById('authMsg');
    const unlockBtn = document.getElementById('unlockBtn');
    const reposGrid = document.getElementById('repos');

    function showAuthError(text) {
      authMsg.textContent = text;
      authCard.classList.remove('shake');
      void authCard.offsetWidth; // trigger reflow
      authCard.classList.add('shake');
      passInput.focus();
    }

    function checkPass() {
      const input = passInput.value.trim();
      if (!input) {
        showAuthError('请输入密钥');
        return;
      }
      if (input === CORRECT_PASS) {
        authOverlay.style.opacity = '0';
        setTimeout(() => {
          authOverlay.style.display = 'none';
        }, 300);
        localStorage.setItem('lab_auth', 'true');
        fetchRepos();
      } else {
        showAuthError('密钥错误，请重新输入');
      }
    }

    unlockBtn.addEventListener('click', checkPass);
    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPass();
    });

    // Check existing auth session
    if (localStorage.getItem('lab_auth') === 'true') {
      authOverlay.style.display = 'none';
      fetchRepos();
    }

    // Render loading skeletons
    function renderSkeletons() {
      reposGrid.innerHTML = Array.from({ length: 4 })
        .map(
          () => `
          <div class="liquid-glass skeleton-card">
            <div>
              <div class="skeleton-line short"></div>
              <div class="skeleton-line full"></div>
              <div class="skeleton-line medium"></div>
            </div>
            <div class="skeleton-line full" style="height: 2.5rem; margin-top: 1.5rem;"></div>
          </div>
        `
        )
        .join('');
    }

    async function fetchRepos() {
      renderSkeletons();
      try {
        const res = await fetch(
          `https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`
        );
        if (!res.ok) throw new Error(`GitHub API Error: ${res.status}`);
        const repos = await res.json();
        reposGrid.innerHTML = '';

        const filtered = repos.filter(
          (r) => r.has_pages && r.name !== USERNAME + '.github.io'
        );

        if (filtered.length === 0) {
          reposGrid.innerHTML = `
            <div class="liquid-glass fallback-box">
              <h3 class="serif" style="font-size: 1.5rem; margin: 0 0 0.5rem;">暂无可用的在线工具</h3>
              <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem;">当前仓库暂未检测到开启 GitHub Pages 的公开项目。</p>
            </div>
          `;
          return;
        }

        filtered.forEach((repo) => {
          const card = document.createElement('article');
          card.className = 'liquid-glass repo-card';
          card.innerHTML = `
            <div>
              <h2 class="repo-name serif">${repo.name}</h2>
              <p class="repo-desc">${repo.description || '在线 AI 实验室服务已部署就绪'}</p>
            </div>
            <a target="_blank" rel="noopener noreferrer" href="https://${USERNAME}.github.io/${repo.name}/" class="repo-link">
              立即访问 &rarr;
            </a>
          `;
          reposGrid.appendChild(card);
        });
      } catch (e) {
        console.warn('[GitHub API]', e);
        // Resilient Fallback UI
        reposGrid.innerHTML = `
          <div class="liquid-glass fallback-box">
            <h3 class="serif" style="font-size: 1.6rem; margin: 0 0 0.5rem;">服务列表同步受限</h3>
            <p style="color: rgba(255,255,255,0.75); font-size: 0.9rem; line-height: 1.6;">
              由于 GitHub API 频次限制或网络波动，暂时无法拉取最新仓库列表。
            </p>
            <button onclick="fetchRepos()" class="retry-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
              重新同步
            </button>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
